name: Sync from cybercore

# The official cybercore.* packs are generated from cybercoretech/cybercore
# (packs/packs.json lists them). This workflow regenerates payloads,
# pack.json checksums and registry/index.json and opens a PR when they change.

on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-cybercore
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate official packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch cybercore
        run: git clone --depth 1 https://github.com/cybercoretech/cybercore.git "$RUNNER_TEMP/cybercore"

      - name: Export
        run: python3 "$RUNNER_TEMP/cybercore/tools/export-distribution.py" packs .

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # PRs opened with GITHUB_TOKEN do not start other workflows, so the
      # pack checks run here before the PR is opened.
      - name: Validate
        env:
          # Build outside the checkout so nothing but pack files can reach the PR.
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          find registry schemas packs -name '*.json' -print0 | xargs -0 -n1 jq empty
          cargo test --workspace
          cargo run --quiet --example verify_registry

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev="$(git -C "$RUNNER_TEMP/cybercore" rev-parse --short HEAD)"
          {
            echo "Generated from [cybercore@${rev}](https://github.com/cybercoretech/cybercore/commit/${rev}) by \`tools/export-distribution.py packs\`."
            echo
            echo "Changed packs get the next patch version; unchanged packs keep theirs. Manifests and every resource checksum were verified in the sync run."
            echo
            echo '```'
            git status --short | head -100
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          bash "$RUNNER_TEMP/cybercore/tools/open-sync-pr.sh" sync/cybercore "chore(packs): sync from cybercore@${rev}" "$RUNNER_TEMP/body.md"
