[workspace]
members = ["crates/cybercore-packs", "crates/cybercore-pack"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cybercoretech/cybercore-packs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
