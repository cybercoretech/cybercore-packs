[package]
name = "cybercore-pack"
version = "0.1.0"
description = "Command-line pack manager for Cybercore"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cybercore-packs = { path = "../cybercore-packs" }
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "cybercore-control"
path = "src/main.rs"

[[bin]]
name = "cybercore-pack"
path = "src/main.rs"
